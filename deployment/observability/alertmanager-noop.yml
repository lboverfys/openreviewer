global:
  resolve_timeout: 5m

# 没有配置外部 Webhook 时仍保留完整路由，告警可在 Alertmanager 和 Prometheus
# 中查看，但不会向任何外部系统发送通知。
route:
  receiver: openreviewer-noop
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: openreviewer-noop

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
