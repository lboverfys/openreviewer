global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: niuma-2

rule_files:
  - /etc/prometheus/openreviewer-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: openreviewer-api
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - api
        type: A
        port: 18090
        refresh_interval: 15s

  - job_name: openreviewer-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - worker
          - index-worker
        type: A
        port: 18091
        refresh_interval: 15s
