global:
  resolve_timeout: 5m

route:
  receiver: openreviewer-operations
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: openreviewer-operations
    webhook_configs:
      - url_file: /run/secrets/alert-webhook-url
        send_resolved: true
        max_alerts: 20

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
