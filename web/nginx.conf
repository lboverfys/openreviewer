worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 32k;

    limit_req_zone $binary_remote_addr zone=openreviewer_login:10m rate=5r/m;
    limit_req_status 429;

    upstream openreviewer_api {
        server api:18090;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/openreviewer.crt;
        ssl_certificate_key /etc/nginx/tls/openreviewer.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"openreviewer-web"}';
        }

        location = /api/v1/auth/login {
            limit_req zone=openreviewer_login burst=4 nodelay;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location = /webhooks/github {
            client_max_body_size 256k;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location = /api/v1/reviews/stream {
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_hide_header Server;
            add_header X-Accel-Buffering "no" always;
        }

        location ~ ^/api/v1/(?:auth/(?:logout|me)|dashboard|reviews)$ {
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location /api/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            expires max;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
