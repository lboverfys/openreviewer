worker_processes auto;
worker_shutdown_timeout 20s;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 32k;

    limit_req_zone $binary_remote_addr zone=openreviewer_login:10m rate=5r/m;
    limit_req_status 429;

    upstream openreviewer_api {
        server api:18090;
        keepalive 16;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/openreviewer.crt;
        ssl_certificate_key /etc/nginx/tls/openreviewer.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"openreviewer-web"}';
        }

        location = /api/v1/auth/login {
            limit_req zone=openreviewer_login burst=4 nodelay;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location = /webhooks/github {
            client_max_body_size 256k;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location = /api/v1/reviews/stream {
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_hide_header Server;
            add_header X-Accel-Buffering "no" always;
        }

        location ~ ^/api/v1/(?:auth/(?:logout|me|sessions/revoke-all)|dashboard|reviews(?:/[A-Za-z0-9._~-]+(?:/(?:actions|retrieval|change-token|identity/sync|events|batches|findings(?:/[A-Za-z0-9._~-]+)?))?)?|settings/(?:ai(?:/providers/(?:openai|anthropic)(?:/(?:test|activate))?|/review-policy|/agents(?:/(?:security|convention|logic|summary)(?:/(?:test|enabled))?)?)?|audits))$ {
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location ~ ^/api/v1/knowledge/(?:search|project-pack|documents(?:/[A-Za-z0-9._~-]+(?:/(?:archive|restore|versions(?:/[1-9][0-9]*/restore)?))?)?)$ {
            client_max_body_size 544k;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location ~ ^/api/v1/retrieval/(?:targets|operations|settings(?:/test)?|indexes(?:/[A-Za-z0-9._~-]+(?:/(?:retry|enrich|search))?)?|evaluations)$ {
            client_max_body_size 544k;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 420s;
            proxy_hide_header Server;
        }

        location /api/ {
            return 404;
        }

        location ~ ^/api/v1/evaluations/(?:sources|datasets(?:/[A-Za-z0-9._~-]+(?:/(?:archive|cases|observations|report|overview|audits))?)?|cases/[A-Za-z0-9._~-]+(?:/(?:reference(?:/reviews)?|observations/(?:baseline|candidate)(?:/(?:changes|submit|source|findings(?:/[A-Za-z0-9._~-]+/review)?))?))?)$ {
            client_max_body_size 128k;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location ~ ^/api/v1/team/(?:members(?:/[A-Za-z0-9_.@-]+)?|repositories(?:/[A-Za-z0-9._~-]+)?|audits)$ {
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location /assets/ {
            try_files $uri =404;
            expires max;
        }

        location ~ ^/api/v1/platform/reviews/[A-Za-z0-9._~-]+/static-report$ {
            client_max_body_size 4m;
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location ~ ^/api/v1/platform/(?:usage(?:/[A-Za-z0-9._~-]+/(?:requests|breakdown))?|work-items(?:/[A-Za-z0-9._~-]+(?:/knowledge)?)?|approvals|profiles(?:/[A-Za-z0-9._~-]+/(?:activate|quality))?|reviews/[A-Za-z0-9._~-]+/static-findings|evidence|diagnostics|workers|audits)$ {
            proxy_pass http://openreviewer_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_hide_header Server;
        }

        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
