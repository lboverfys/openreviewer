[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openreviewer"
version = "0.1.0"
description = "A recoverable and auditable AI code review orchestration platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "unidiff>=0.7,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
include = ["apps*", "domain*", "persistence*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]
