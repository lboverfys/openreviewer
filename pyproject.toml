[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openreviewer"
version = "0.2.0"
description = "A recoverable and auditable AI code review orchestration platform."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=44,<51",
    "fastapi>=0.115,<1",
    # pinned_http.py replaces HTTPTransport's network backend through the
    # 0.28/1.0 connection-pool contract; widen this only after a compatibility
    # test covers a newer transport implementation.
    "httpcore>=1,<1.1",
    "httpx>=0.28,<0.29",
    "PyJWT[crypto]>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pgvector>=0.5,<0.6",
    "sqlalchemy>=2.0,<3",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-java>=0.23.5,<0.24",
    "unidiff>=0.7,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "domain*", "persistence*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.coverage.run]
branch = true
source = ["apps", "domain", "persistence", "services"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["unidiff", "unidiff.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "domain", "persistence", "services"]
